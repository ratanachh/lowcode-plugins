<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <link
      rel="stylesheet"
      href="https://alifd.alicdn.com/npm/@alifd/theme-lowcode-light@0.2.1/variables.css"
    />
    <link
      rel="stylesheet"
      href="https://alifd.alicdn.com/npm/@alifd/theme-lowcode-light@0.2.1/dist/next.var.min.css"
    />
    <link
      rel="stylesheet"
      href="https://g.alicdn.com/ali-lowcode/ali-lowcode-engine/1.0.77/engine-core.css"
    />
    <link
      rel="stylesheet"
      href="https://dev.g.alicdn.com/ali-lowcode/lowcode-engine-ext/1.0.21/engine-ext.css"
    />
    <script src="https://g.alicdn.com/code/lib/prettier/2.6.0/standalone.js"></script>
    <link
      rel="stylesheet"
      href="https://alifd.alicdn.com/npm/@rchh/lowcode-engine@latest/dist/css/engine-core.css"
    />
    <!-- Fusion Next component styles -->
    <link
      rel="stylesheet"
      href="https://g.alicdn.com/code/lib/alifd__next/1.23.24/next.min.css"
    />
    <!-- Lowcode engine page theme; can be swapped for theme-lowcode-dark -->
    <link
      rel="stylesheet"
      href="https://alifd.alicdn.com/npm/@alifd/theme-lowcode-light/0.2.0/next.min.css"
    />
    <!-- Styles of the official lowcode engine extensions -->
    <link
      rel="stylesheet"
      href="https://alifd.alicdn.com/npm/@rchh/lowcode-engine-ext@latest/dist/css/engine-ext.css"
    />

    <!-- React; can be swapped for the production build -->
    <script src="https://g.alicdn.com/code/lib/react/16.14.0/umd/react.development.js"></script>
    <!-- React DOM; can be swapped for the production build -->
    <script src="https://g.alicdn.com/code/lib/react-dom/16.14.0/umd/react-dom.development.js"></script>
    <!-- React backwards compatibility, needed by some materials -->
    <script src="https://g.alicdn.com/code/lib/prop-types/15.7.2/prop-types.js"></script>
    <script src="https://g.alicdn.com/platform/c/react15-polyfill/0.0.1/dist/index.js"></script>
    <!-- lodash, a dependency of the lowcode editor -->
    <script src="https://g.alicdn.com/platform/c/lodash/4.6.1/lodash.min.js"></script>
    <!-- Date library, a dependency of Fusion Next -->
    <script src="https://g.alicdn.com/code/lib/moment.js/2.29.1/moment-with-locales.min.js"></script>
    <!-- Fusion Next main bundle, a dependency of the lowcode editor -->
    <script src="https://g.alicdn.com/code/lib/alifd__next/1.23.24/next.min.js"></script>
    <!-- Lowcode engine main bundle -->
    <script
      crossorigin="anonymous"
      src="https://alifd.alicdn.com/npm/@rchh/lowcode-engine@latest/dist/js/engine-core.js"
    ></script>
    <!-- Main bundle of the official lowcode engine extensions -->
    <script
      crossorigin="anonymous"
      src="https://alifd.alicdn.com/npm/@rchh/lowcode-engine-ext@latest/dist/js/engine-ext.js"
    ></script>
    <script>
      React.PropTypes = PropTypes;
    </script>
    <title>React App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
